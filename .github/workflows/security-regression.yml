name: Security Regression

on:
  workflow_call:

env:
  HUSKY: 0
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  frontend-security:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Security Regression
        run: npx vitest run src/screens/security/role src/utils/permissions.test.ts src/components/progress-bar/progress-bar.history.test.tsx src/components/three-dots-actions/index.test.tsx --maxWorkers=2 --no-file-parallelism
      - name: Security lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx eslint --quiet src/screens/security/role src/screens/security/user src/components/progress-bar/progress-bar.tsx src/components/progress-bar/progress-bar.history.test.tsx src/components/three-dots-actions/index.tsx src/components/three-dots-actions/index.test.tsx src/utils/permissions.ts src/utils/permissions.test.ts
      - name: Validate Security documentation
        run: node scripts/docs/validate-docs.mjs --module security
