name: Build and deploy Next.js app to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APPLICATION_PUBLISH_PROFILE: ${{ secrets.APP_PUBLISH_PROFILE }}
  WEBAPP_NAME: 'dev-gyanmirai-fe-g2gxevgda4h0h0hm'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps (prod only)
        run: npm ci --omit=dev --ignore-scripts

      - name: Build Next.js
        run: NODE_OPTIONS="--max-old-space-size=8192" npm run build

      - name: Prepare standalone package
        run: |
          mkdir -p .next/standalone/public
          cp -R ./public ./build/standalone/public
          cp -R ./build/static ./build/standalone/build/static

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: ./build/standalone

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          publish-profile: ${{ env.APPLICATION_PUBLISH_PROFILE }}
          package: .
