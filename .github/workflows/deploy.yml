name: Build and deploy Next.js app to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APPLICATION_PUBLISH_PROFILE: ${{ secrets.APP_PUBLISH_PROFILE }}
  WEBAPP_NAME: 'dev-gyanmirai-fe'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps (prod only)
        run: npm ci --omit=dev --ignore-scripts

      - name: Build Next.js
        run: NODE_OPTIONS="--max-old-space-size=8192" npm run build

      - name: Prepare standalone build
        run: |
          echo "Preparing standalone build..."
          cp -r public build/standalone/public
          cp -r build/static build/standalone/build/static

      - name: Verify build output
        run: |
          echo "Checking standalone folder..."
          ls -la build/standalone
          echo "Checking server.js..."
          ls -la build/standalone/server.js
          
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          publish-profile: ${{ env.APPLICATION_PUBLISH_PROFILE }}
          package: build/standalone
