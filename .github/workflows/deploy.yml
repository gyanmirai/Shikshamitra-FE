name: Build and deploy Next.js app to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APPLICATION_PUBLISH_PROFILE: ${{ secrets.APP_PUBLISH_PROFILE }}
  WEBAPP_NAME: 'dev-gyanmirai-fe'
  HUSKY: 0 # ✅ disable husky in CI

jobs:
  security:
    uses: ./.github/workflows/security-regression.yml
  build:
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci # ✅ install ALL deps (IMPORTANT)

      - name: Validate HR documentation
        run: npm run docs:hr:check

      - name: Run HR regression tests
        run: npx vitest run src/redux/hr src/screens/hr src/utils/hr-audit-format.test.ts

      - name: Build Next.js
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=3072

      - name: Prepare standalone build
        run: |
          echo "Preparing standalone build..."
          cp -r public build/standalone/public
          cp -r build/static build/standalone/build/static

      - name: Verify build output
        run: ls -la build/standalone

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          publish-profile: ${{ secrets.APPLICATION_PUBLISH_PROFILE }}
          package: build/standalone
