name: Dashboard Validation

on:
  workflow_call:

env:
  HUSKY: 0
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  dashboard-fe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dashboard lint
        run: npm run lint:dashboard

      - name: Dashboard E2E discovery
        run: npm run test:e2e:dashboard -- --list
        env:
          E2E_API_URL: http://localhost:44332

      - name: TypeScript
        run: npm run ts
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Production build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
