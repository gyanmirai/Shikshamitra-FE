tags:
  - name: Student Leave

paths:
  /students/leaves:
    post:
      summary: Create Student Leave Request
      deprecated: false
      description: Create a new leave request for a student
      operationId: createStudentLeave
      tags:
        - Student Leave
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLeaveRequest'
      responses:
        '200':
          description: Leave request created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateLeaveResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
      security:
        - BearerAuth8: []
      x-security:
        authType: JWT
        roles:
          - ADMIN
          - STAFF
          - TEACHER
        permission: STUDENT_LEAVE_CREATE
        dataClassification: Internal

    get:
      summary: Get Student Leave List
      deprecated: false
      description: Fetch leave requests with filters
      operationId: getStudentLeaves
      tags:
        - Student Leave
      parameters:
        - name: educationMediumStageId
          in: query
          required: true
          schema:
            type: string
            format: uuid

        - name: standardId
          in: query
          required: true
          schema:
            type: string
            format: uuid

        - name: divisionId
          in: query
          required: true
          schema:
            type: string
            format: uuid

        - name: studentId
          in: query
          required: false
          schema:
            type: string
            format: uuid

        - name: leaveType
          in: query
          required: false
          schema:
            type: string

        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [Pending, Approved, Rejected]

        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date

        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date

        - name: page
          in: query
          required: false
          schema:
            type: integer
            example: 1

        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            example: 10

      responses:
        '200':
          description: Leave list fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLeaveListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
      security:
        - BearerAuth8: []
      x-security:
        authType: JWT
        roles:
          - ADMIN
          - STAFF
          - TEACHER
        permission: STUDENT_LEAVE_VIEW
        dataClassification: Internal

components:
  schemas:

    CreateLeaveRequest:
      type: object
      required:
        - educationMediumStageId
        - standardId
        - divisionId
        - studentId
        - leaveType
        - startDate
        - endDate
      properties:
        educationMediumStageId:
          type: string
          format: uuid

        standardId:
          type: string
          format: uuid

        divisionId:
          type: string
          format: uuid

        studentId:
          type: string
          format: uuid

        leaveType:
          type: string
          example: sick

        isHalfDay:
          type: boolean
          example: true

        startDate:
          type: string
          format: date

        endDate:
          type: string
          format: date

        description:
          type: string

        attachmentUrl:
          type: string
          nullable: true

    CreateLeaveResponse:
      type: object
      properties:
        leaveId:
          type: string
          format: uuid

    GetLeaveListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LeaveItem'

        pagination:
          type: object
          properties:
            page:
              type: integer
            pageSize:
              type: integer
            totalRecords:
              type: integer

    LeaveItem:
      type: object
      properties:
        leaveId:
          type: string
          format: uuid

        studentName:
          type: string

        educationMediumStage:
          type: string

        standard:
          type: string

        division:
          type: string

        leaveType:
          type: string

        startDate:
          type: string
          format: date

        endDate:
          type: string
          format: date

        totalDays:
          type: number
          example: 1

        description:
          type: string

        remarks:
          type: string

        status:
          type: string
          enum: [Pending, Approved, Rejected]